spring:
  datasource:
    url: jdbc:h2:mem:test

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: false

  config:
    activate:
      on-profile: test

microservice:
  account-service:
    ip: http://localhost:8082
    path-to-report: /mock/accounts/find-by-logins

report:
  name:
    report.csv